server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg|png|webp|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
